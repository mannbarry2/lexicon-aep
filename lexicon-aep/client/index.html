    <style>
      @keyframes clap {
        0% { transform: scale(1); }
        50% { transform: scale(1.5); }
        100% { transform: scale(1); }
      }
      /* Shell shown while the JS bundle loads — React replaces #root on mount */
      .shell {
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: #1e293b;
        max-width: 80rem;
        margin: 0 auto;
        padding: 1.5rem 1rem 0;
      }
      .shell-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding-bottom: 1.25rem;
        border-bottom: 1px solid #e2e8f0;
      }
      .shell-logo {
        display: flex;
        flex-direction: column;
        line-height: 1;
      }
      .shell-logo .aep {
        font-size: 2rem;
        font-weight: 800;
        color: #2563eb;
        letter-spacing: -0.02em;
      }
      .shell-logo .lexicon {
        font-size: 1.25rem;
        font-weight: 500;
        color: #64748b;
        letter-spacing: 0.01em;
      }
      .shell-mark {
        flex-shrink: 0;
      }
      .shell-platform {
        font-size: 1.125rem;
        color: #475569;
        font-weight: 500;
      }
      .shell-tagline {
        margin-top: 0.5rem;
        font-size: 0.875rem;
        color: #64748b;
        font-style: italic;
      }
      .shell-grid {
        margin-top: 2rem;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1rem;
      }
      .shell-card {
        border: 1px solid #e2e8f0;
        border-left: 4px solid #e2e8f0;
        border-radius: 0.5rem;
        padding: 1.25rem;
        background: #fff;
      }
      .shell-skeleton {
        background: linear-gradient(90deg, #f1f5f9 0%, #e2e8f0 50%, #f1f5f9 100%);
        background-size: 200% 100%;
        animation: shell-pulse 1.4s ease-in-out infinite;
        border-radius: 0.25rem;
      }
      .shell-skeleton.title { height: 1.25rem; width: 60%; }
      .shell-skeleton.line { height: 0.75rem; margin-top: 0.625rem; width: 100%; }
      .shell-skeleton.line.short { width: 75%; }
      @keyframes shell-pulse {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="shell">
        <div class="shell-header">
          <svg class="shell-mark" width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <g stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 9 L9 9 L9 39 L14 39" stroke="#2563eb" stroke-width="3.5"/>
              <path d="M34 9 L39 9 L39 39 L34 39" stroke="#2563eb" stroke-width="3.5"/>
              <path d="M24 15 L18 34 M24 15 L30 34" stroke="#2563eb" stroke-width="4"/>
              <path d="M20 27 L28 27" stroke="#14b8a6" stroke-width="3.5"/>
            </g>
          </svg>
          <div class="shell-logo">
            <span class="aep">AEP</span>
            <span class="lexicon">Lexicon</span>
          </div>
          <span class="shell-platform">Experience Platform</span>
        </div>
        <p class="shell-tagline">The definitive terminology guide for Adobe Experience Platform</p>
        <div class="shell-grid">
          <div class="shell-card"><div class="shell-skeleton title"></div><div class="shell-skeleton line"></div><div class="shell-skeleton line"></div><div class="shell-skeleton line short"></div></div>
          <div class="shell-card"><div class="shell-skeleton title"></div><div class="shell-skeleton line"></div><div class="shell-skeleton line"></div><div class="shell-skeleton line short"></div></div>
          <div class="shell-card"><div class="shell-skeleton title"></div><div class="shell-skeleton line"></div><div class="shell-skeleton line"></div><div class="shell-skeleton line short"></div></div>
          <div class="shell-card"><div class="shell-skeleton title"></div><div class="shell-skeleton line"></div><div class="shell-skeleton line"></div><div class="shell-skeleton line short"></div></div>
          <div class="shell-card"><div class="shell-skeleton title"></div><div class="shell-skeleton line"></div><div class="shell-skeleton line"></div><div class="shell-skeleton line short"></div></div>
          <div class="shell-card"><div class="shell-skeleton title"></div><div class="shell-skeleton line"></div><div class="shell-skeleton line"></div><div class="shell-skeleton line short"></div></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
